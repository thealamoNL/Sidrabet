    <script>
        // 1. Maak een lijst met toegestane namen (hoofdlettergevoelig)
        const toegestaneNamen = ["Alem", "Martha", "Mebrat", "Medhanie", "Simon", "Miriam", "Robel", "Amanuel", "Tsehai"];

        // 2. Vraag de gebruiker om een naam in te vullen
        const ingevoerdeNaam = prompt("Voer je naam in om toegang te krijgen:");

        // 3. Controleer of de naam in de lijst staat
        // .trim() verwijdert eventuele spaties voor/na de ingevoerde naam
        if (ingevoerdeNaam && toegestaneNamen.includes(ingevoerdeNaam.trim())) {
            // Naam is goed: de pagina laadt gewoon verder
            alert("Welkom " + ingevoerdeNaam.trim() + "!");
        } else {
            // Naam staat niet in de lijst of er is op 'Annuleren' gedrukt
            alert("Toegang geweigerd. Je wordt doorgestuurd naar de hoofdpagina.");
            // Stuur de gebruiker terug naar de hoofdpagina (pas de URL eventueel aan)
            window.location.href = "index.html"; 
        }
    </script>
